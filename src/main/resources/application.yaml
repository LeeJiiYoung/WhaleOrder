spring:
  application:
    name: whale-order

  profiles:
    active: dev

  # 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # 지연 로딩 컬렉션/프록시를 IN 절로 묶어서 조회 — N+1 방어.
        # 주문 목록은 컬렉션(orderItems)을 fetch join 하지 않고 ToOne(store·member)만 조인하는데,
        # 그 대가로 OrderResponse.from() 이 orderItems·menu 를 건드릴 때 주문 건수만큼 쿼리가 나간다.
        # 이 설정이 있으면 주문 N건을 한 번에 조회해도 컬렉션 로딩이 IN 절 한 방으로 합쳐진다.
        default_batch_fetch_size: 100
    open-in-view: false

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: whale-order
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.whale.order.*"

  # OAuth2 (카카오 SSO)
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000    # 30분 (ms)
  refresh-token-expiry: 604800000 # 7일 (ms)

# 토스페이먼츠 (기본값은 토스 문서에 공개된 테스트용 시크릿 키 — 로컬 개발용, 운영에선 TOSS_SECRET_KEY로 교체)
toss:
  secret-key: ${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}

# 애플리케이션 공통 설정 (프로필 무관 기본값 — 누락 시 startup 실패를 방지)
# OAuth2 로그인 성공 후 프론트로 토큰을 전달할 리다이렉트 주소. 운영에서는 OAUTH2_REDIRECT_URI 로 교체
app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/callback}

# Actuator & Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
